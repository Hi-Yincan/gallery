baseURL = "https://hyc.ac/gallery/"
copyright = "© Yincan Huang"
defaultContentLanguage = "zh-cn"
enableRobotsTXT = true
languageCode = "zh-cn"
timeZone = "Asia/Shanghai"
timeout = "120s"
title = "Gallery"
theme = "hugo-theme-gallery"

# 内容仓库根 README.md 仅作说明,不渲染为网页
ignoreFiles = ['README\.md$']

[params]
  defaultTheme = "dark"
  description = "摄影作品集:自拍、人像、旅行"
  title = "Gallery"
  [params.author]
    email = "Yincan_Huang@zju.edu.cn"
    name = "Yincan Huang"
  [params.socialIcons]
    github = "https://github.com/HuangYincan"
  [params.gallery]
    #boxSpacing = 10
    #targetRowHeight = 288
    #targetRowHeightTolerance = 0.25

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML"]

# 只保留 categories 分类(tags 默认启用,但本站用不到)
[taxonomies]
  category = "categories"

# 底部导航菜单
[[menu.footer]]
  name = "GitHub"
  url = "https://github.com/Hi-Yincan"
  weight = 1
[[menu.footer]]
  name = "Theme"
  url = "https://github.com/nicokaiser/hugo-theme-gallery"
  weight = 2

[imaging]
  quality = 95
  resampleFilter = "Lanczos"
  [imaging.exif]
    disableDate = false
    disableLatLong = true
    includeFields = "ImageDescription|Orientation"
