name: deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [content-update]
  workflow_dispatch:

permissions:
  contents: write

# 连续 push(如内容仓库 dispatch + 本仓库 push 撞车)时,只保留最新一次构建,
# 避免两个 runner 同时 bump content 指针造成非快进冲突
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules yet)
        uses: actions/checkout@v4

      - name: Init submodules (theme public, content private via PAT)
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          git config --global url."https://x-access-token:${PAT}@github.com/".insteadOf "https://github.com/"
          git submodule update --init themes/hugo-theme-gallery
          git submodule update --init --remote content
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet content; then
            git add content
            git commit -m "chore: bump content submodule to $(git -C content rev-parse --short HEAD)"
          fi

      - name: Guard unsupported formats (DNG/HEIC break build)
        run: |
          BAD=$(find content -iname '*.dng' -o -iname '*.heic' -o -iname '*.heif')
          if [ -n "$BAD" ]; then
            echo "⚠️ 发现不支持的格式,已自动剔除(不会部署):"
            echo "$BAD"
            find content -iname '*.dng' -o -iname '*.heic' -o -iname '*.heif' -delete
          else
            echo "✅ 无 DNG/HEIC"
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.135.0"
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
